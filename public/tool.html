            }).join(' ');

        function slugToCategory(slug) {
            if (slug.includes('text') || slug.includes('word') || slug.includes('character') || slug.includes('case') || slug.includes('reverse') || slug.includes('lorem') || slug.includes('palindrome') || slug.includes('morse') || slug.includes('emoji') || slug.includes('reading')) return 'Text Tools';
            if (slug.includes('json') || slug.includes('xml') || slug.includes('css') || slug.includes('js') || slug.includes('regex') || slug.includes('uuid') || slug.includes('guid') || slug.includes('string') || slug.includes('url') || slug.includes('base64') || slug.includes('html')) return 'Developer Tools';
            if (slug.includes('password') || slug.includes('hash') || slug.includes('md5') || slug.includes('sha') || slug.includes('encrypt') || slug.includes('decrypt') || slug.includes('email') || slug.includes('phone') || slug.includes('credit') || slug.includes('ip') || slug.includes('domain') || slug.includes('2fa') || slug.includes('two-factor') || slug.includes('otp') || slug.includes('security') || slug.includes('ssl') || slug.includes('virus') || slug.includes('malware')) return 'Security Tools';
            if (slug.includes('qr') || slug.includes('unit') || slug.includes('currency') || slug.includes('temperature') || slug.includes('speed') || slug.includes('weight') || slug.includes('length') || slug.includes('area') || slug.includes('volume') || slug.includes('binary') || slug.includes('hex') || slug.includes('decimal') || slug.includes('fraction') || slug.includes('roman')) return 'Converter Tools';
            if (slug.includes('bmi') || slug.includes('age') || slug.includes('percentage') || slug.includes('loan') || slug.includes('tip') || slug.includes('discount') || slug.includes('mortgage') || slug.includes('compound') || slug.includes('simple-interest') || slug.includes('savings') || slug.includes('retirement') || slug.includes('tax') || slug.includes('salary') || slug.includes('calorie') || slug.includes('gpa') || slug.includes('cgpa') || slug.includes('grade') || slug.includes('factorial') || slug.includes('square-root') || slug.includes('prime')) return 'Calculator Tools';
            if (slug.includes('random') || slug.includes('name') || slug.includes('time') || slug.includes('date') || slug.includes('days') || slug.includes('stopwatch') || slug.includes('countdown') || slug.includes('world-clock') || slug.includes('counter') || slug.includes('todo') || slug.includes('checklist') || slug.includes('habit') || slug.includes('goal') || slug.includes('budget') || slug.includes('expense') || slug.includes('invoice') || slug.includes('link') || slug.includes('hashtag') || slug.includes('username') || slug.includes('note')) return 'Utility Tools';
            if (slug.includes('color') || slug.includes('rgb') || slug.includes('pick') || slug.includes('palette') || slug.includes('gradient') || slug.includes('shades') || slug.includes('tint') || slug.includes('mix')) return 'Color Tools';
            if (slug.includes('file') || slug.includes('zip') || slug.includes('pdf') || slug.includes('excel') || slug.includes('renamer') || slug.includes('organizer')) return 'File Tools';
            if (slug.includes('dns') || slug.includes('whois') || slug.includes('ping') || slug.includes('traceroute') || slug.includes('port') || slug.includes('subnet') || slug.includes('network') || slug.includes('wifi') || slug.includes('signal') || slug.includes('firewall') || slug.includes('latency') || slug.includes('packet') || slug.includes('bandwidth') || slug.includes('vpn') || slug.includes('proxy')) return 'Network Tools';
            if (slug.includes('seo') || slug.includes('meta') || slug.includes('keyword') || slug.includes('robots') || slug.includes('sitemap') || slug.includes('backlink') || slug.includes('serp') || slug.includes('schema') || slug.includes('page-speed') || slug.includes('google') || slug.includes('bing')) return 'SEO Tools';
            if (slug.includes('bitcoin') || slug.includes('ethereum') || slug.includes('wallet') || slug.includes('crypto') || slug.includes('mining') || slug.includes('staking') || slug.includes('portfolio')) return 'Crypto Tools';
            if (slug.includes('math') || slug.includes('graph') || slug.includes('matrix') || slug.includes('trigonometry') || slug.includes('geometry') || slug.includes('algebra') || slug.includes('derivative') || slug.includes('integral') || slug.includes('equation') || slug.includes('gcd') || slug.includes('lcm') || slug.includes('probability') || slug.includes('permutation') || slug.includes('combination')) return 'Math Tools';
            
            return 'General Tools';
        }

        // ============================================
        // টুল লোড
        // ============================================
        function loadTool(slug) {
            console.log('লোড হচ্ছে:', slug);
            
            const toolName = slugToName(slug);
            const toolIcon = slugToIcon(slug);
            const category = slugToCategory(slug);
            
            // পেজ আপডেট
            document.title = 'Toolkit Pro - ' + toolName;
            document.getElementById('toolName').textContent = toolName;
            document.getElementById('toolDescription').textContent = toolName + ' - ফ্রি অনলাইন টুল';
            document.getElementById('toolIcon').textContent = toolIcon;
            document.getElementById('breadcrumbTool').textContent = toolName;
            
            // ফাংশনালিটি লোড
            document.getElementById('toolFunctionality').innerHTML = createToolFunctionality(slug, toolName, toolIcon);
            
            // সম্পর্কিত টুলস
            loadRelatedTools(category, slug);
            
            // দেখান
            document.getElementById('loadingSpinner').classList.add('hidden');
            document.getElementById('toolContent').classList.remove('hidden');
        }

        // ============================================
        // টুল ফাংশনালিটি তৈরি
        // ============================================
        function createToolFunctionality(slug, toolName, toolIcon) {
            // 2FA Generator
            if (slug.includes('2fa') || slug.includes('two-factor') || slug.includes('otp')) {
                return create2FAGenerator();
            }
            
            // Text Tools
            if (slug.includes('word-counter') || slug.includes('word-count')) return createWordCounter();
            if (slug.includes('character-counter')) return createCharacterCounter();
            if (slug.includes('case-converter')) return createCaseConverter();
            if (slug.includes('text-reverser') || slug.includes('reverse-text')) return createTextReverser();
            if (slug.includes('lorem')) return createLoremGenerator();
            if (slug.includes('frequency')) return createFrequencyCounter();
            if (slug.includes('palindrome')) return createPalindromeChecker();
            if (slug.includes('text-to-slug') || slug.includes('slug-generator')) return createSlugGenerator();
            if (slug.includes('duplicate')) return createDuplicateRemover();
            if (slug.includes('sorter') || slug.includes('sort-text')) return createTextSorter();
            if (slug.includes('find-and-replace') || slug.includes('find-replace')) return createFindReplace();
            
            // Developer Tools
            if (slug.includes('json-formatter')) return createJsonFormatter();
            if (slug.includes('json-validator')) return createJsonValidator();
            if (slug.includes('json-minifier')) return createJsonMinifier();
            if (slug.includes('uuid')) return createUuidGenerator();
            if (slug.includes('guid')) return createUuidGenerator();
            if (slug.includes('base64-encode')) return createBase64Encoder();
            if (slug.includes('base64-decode')) return createBase64Decoder();
            if (slug.includes('url-encode')) return createUrlEncoder();
            if (slug.includes('url-decode')) return createUrlDecoder();
            if (slug.includes('random-string')) return createRandomStringGenerator();
            if (slug.includes('regex')) return createRegexTester();
            
            // Security Tools
            if (slug.includes('password-generator')) return createPasswordGenerator();
            if (slug.includes('password-strength')) return createPasswordStrengthChecker();
            if (slug.includes('email-validator')) return createEmailValidator();
            if (slug.includes('phone-validator')) return createPhoneValidator();
            if (slug.includes('url-validator')) return createUrlValidator();
            if (slug.includes('ip-validator') || slug.includes('ip-lookup')) return createIpLookup();
            if (slug.includes('hash-generator') || slug.includes('md5') || slug.includes('sha')) return createHashGenerator();
            
            // Calculator Tools
            if (slug.includes('bmi')) return createBmiCalculator();
            if (slug.includes('age-calculator')) return createAgeCalculator();
            if (slug.includes('percentage')) return createPercentageCalculator();
            if (slug.includes('discount')) return createDiscountCalculator();
            if (slug.includes('tip-calculator')) return createTipCalculator();
            if (slug.includes('loan')) return createLoanCalculator();
            if (slug.includes('compound-interest')) return createCompoundInterestCalculator();
            if (slug.includes('simple-interest')) return createSimpleInterestCalculator();
            if (slug.includes('factorial')) return createFactorialCalculator();
            if (slug.includes('square-root')) return createSquareRootCalculator();
            if (slug.includes('prime-checker')) return createPrimeChecker();
            if (slug.includes('gcd')) return createGcdCalculator();
            if (slug.includes('lcm')) return createLcmCalculator();
            
            // Converter Tools
            if (slug.includes('temperature')) return createTemperatureConverter();
            if (slug.includes('unit-converter')) return createUnitConverter();
            if (slug.includes('binary-to-text')) return createBinaryToText();
            if (slug.includes('text-to-binary')) return createTextToBinary();

        // ============================================
        function loadRelatedTools(category, currentSlug) {
            const container = document.getElementById('relatedTools');
            container.innerHTML = '';
            
            const relatedSlugs = getRelatedSlugs(category, currentSlug);
            
            if (relatedSlugs.length === 0) {
                container.innerHTML = '<p class="text-gray-500">কোনো সম্পর্কিত টুল নেই</p>';
                return;
            }
            
            relatedSlugs.forEach(function(slug) {
                const name = slugToName(slug);
                const icon = slugToIcon(slug);
                const card = document.createElement('a');
                card.href = '/tool.html?slug=' + slug;
                card.className = 'bg-white rounded-xl shadow-sm border p-5 tool-card-hover block';
                card.innerHTML = '<span class="text-3xl mb-3 block">' + icon + '</span>' +
                    '<h3 class="font-semibold">' + name + '</h3>' +
                    '<p class="text-sm text-gray-500 mt-1">ফ্রি অনলাইন টুল</p>';
                container.appendChild(card);
            });
        }

        function getRelatedSlugs(category, currentSlug) {
            const allSlugs = [
                'word-counter', 'character-counter', 'case-converter', 'text-reverser',
                'json-formatter', 'json-validator', 'uuid-generator', 'base64-encoder',
                'password-generator', 'password-strength-checker', 'email-validator',
                'bmi-calculator', 'age-calculator', 'percentage-calculator',
                'temperature-converter', 'unit-converter', 'binary-to-text',
                'random-number-generator', 'stopwatch', 'countdown-timer',
                'color-picker', 'gradient-generator', 'hex-to-rgb',
                'prime-checker', 'gcd-calculator', 'lcm-calculator',
                'two-factor-generator', 'otp-generator', '2fa-generator',
                'qr-code-generator', 'hash-generator', 'md5-generator',
                'sha256-generator', 'sha512-generator', 'encryption-tool',
                'decryption-tool', 'ssl-checker', 'security-headers',
                'csp-generator', 'htaccess-generator', 'virus-scanner',
                'malware-scanner', 'data-encryptor', 'data-decryptor'
            ];
            
            return allSlugs.filter(function(slug) {
                return slug !== currentSlug && slugToCategory(slug) === category;
            }).slice(0, 3);
        }

        window.convertCase = function(type) {
            const text = document.getElementById('caseInput').value;
            let result = '';
            if (type === 'upper') result = text.toUpperCase();
            else if (type === 'lower') result = text.toLowerCase();
            else if (type === 'title') result = text.replace(/\w\S*/g, function(w) { return w[0].toUpperCase() + w.slice(1).toLowerCase(); });
            else if (type === 'sentence') result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, function(c) { return c.toUpperCase(); });
            document.getElementById('caseResult').textContent = result;

        window.checkPasswordStrength = function() {
            const password = document.getElementById('passInput').value;
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;
            
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            if (score <= 1) { bar.style.width = '20%'; bar.className = 'h-full bg-red-500'; text.textContent = 'খুব দুর্বল'; }
            else if (score <= 2) { bar.style.width = '40%'; bar.className = 'h-full bg-orange-500'; text.textContent = 'দুর্বল'; }
            else if (score <= 3) { bar.style.width = '60%'; bar.className = 'h-full bg-yellow-500'; text.textContent = 'মোটামুটি'; }
            else if (score <= 4) { bar.style.width = '80%'; bar.className = 'h-full bg-green-500'; text.textContent = 'শক্তিশালী'; }

        window.generateHash = async function(algorithm) {
            const text = document.getElementById('hashInput').value;
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest(algorithm, data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
            document.getElementById('hashResult').textContent = hashHex;
        };

            const heightCm = parseFloat(document.getElementById('bmiHeight').value);
            const heightM = heightCm / 100;
            const bmi = weight / (heightM * heightM);
            
            let category;
            if (bmi < 18.5) category = 'কম ওজন';
            else if (bmi < 25) category = 'স্বাভাবিক ওজন';
            else if (bmi < 30) category = 'অতিরিক্ত ওজন';
            else category = 'স্থূলতা';
            
            document.getElementById('bmiResult').textContent = 'BMI: ' + bmi.toFixed(1);
            document.getElementById('bmiCategory').textContent = category;
        };

        window.calculateAge = function() {
            const birth = new Date(document.getElementById('birthDate').value);
            const now = new Date();
            
            let years = now.getFullYear() - birth.getFullYear();
            let months = now.getMonth() - birth.getMonth();
            let days = now.getDate() - birth.getDate();
            
            if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
            if (months < 0) { years--; months += 12; }
            
            document.getElementById('ageResult').textContent = years + ' বছর, ' + months + ' মাস, ' + days + ' দিন';
        };

        window.calculateDiscount = function() {
            const price = parseFloat(document.getElementById('discountPrice').value);
            const percent = parseFloat(document.getElementById('discountPercent').value);
            const discount = price * percent / 100;
            const final = price - discount;
            document.getElementById('discountResult').textContent = 'ছাড়: ' + discount.toFixed(2) + ' | চূড়ান্ত: ' + final.toFixed(2);
        };

        window.calculateTip = function() {
            const bill = parseFloat(document.getElementById('tipBill').value);
            const percent = parseFloat(document.getElementById('tipPercent').value);
            const tip = bill * percent / 100;
            document.getElementById('tipResult').textContent = 'টিপ: ' + tip.toFixed(2) + ' | মোট: ' + (bill + tip).toFixed(2);
        };

        window.calculateLoan = function() {
            const amount = parseFloat(document.getElementById('loanAmount').value);
            const annualRate = parseFloat(document.getElementById('loanRate').value);
            const months = parseInt(document.getElementById('loanTerm').value);
            const monthlyRate = annualRate / 12 / 100;
            const emi = amount * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
            document.getElementById('loanResult').textContent = 'মাসিক EMI: ' + emi.toFixed(2) + ' টাকা';
        };

        window.calculateCI = function() {
            const principal = parseFloat(document.getElementById('ciPrincipal').value);
            const rate = parseFloat(document.getElementById('ciRate').value) / 100;
            const years = parseInt(document.getElementById('ciYears').value);
            const compounds = parseInt(document.getElementById('ciCompounds').value);
            const amount = principal * Math.pow(1 + rate / compounds, compounds * years);
            const interest = amount - principal;
            document.getElementById('ciResult').textContent = 'মোট: ' + amount.toFixed(2) + ' | সুদ: ' + interest.toFixed(2);
        };

        window.calculateSI = function() {
            const principal = parseFloat(document.getElementById('siPrincipal').value);
            const rate = parseFloat(document.getElementById('siRate').value);
            const years = parseInt(document.getElementById('siYears').value);
            const interest = principal * rate * years / 100;
            document.getElementById('siResult').textContent = 'সুদ: ' + interest.toFixed(2) + ' | মোট: ' + (principal + interest).toFixed(2);
        };

        window.calculateFactorial = function() {
            const num = parseInt(document.getElementById('factorialInput').value);
            let result = 1;
            for (let i = 2; i <= num; i++) result *= i;
            document.getElementById('factorialResult').textContent = num + '! = ' + result;
        };

        window.calculateSqrt = function() {
            const num = parseFloat(document.getElementById('sqrtInput').value);
            document.getElementById('sqrtResult').textContent = '√' + num + ' = ' + Math.sqrt(num).toFixed(4);
        };

        window.checkPrime = function() {
            const num = parseInt(document.getElementById('primeInput').value);
            let isPrime = true;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) { isPrime = false; break; }
            }
            document.getElementById('primeResult').textContent = num + (isPrime ? ' মৌলিক সংখ্যা!' : ' মৌলিক নয়!');
        };

        window.calculateGCD = function() {
            let a = parseInt(document.getElementById('gcd1').value);
            let b = parseInt(document.getElementById('gcd2').value);
            while (b !== 0) { const temp = b; b = a % b; a = temp; }
            document.getElementById('gcdResult').textContent = 'GCD: ' + Math.abs(a);
        };

        window.calculateLCM = function() {
            const a = parseInt(document.getElementById('lcm1').value);
            const b = parseInt(document.getElementById('lcm2').value);
            let x = a, y = b;
            while (y !== 0) { const temp = y; y = x % y; x = temp; }
            const lcm = Math.abs(a * b) / x;
            document.getElementById('lcmResult').textContent = 'LCM: ' + lcm;
        };

        window.convertTemperature = function() {
            const value = parseFloat(document.getElementById('tempValue').value);
            const from = document.getElementById('tempFrom').value;
            const to = document.getElementById('tempTo').value;
            
            let celsius;
            if (from === 'c') celsius = value;
            else if (from === 'f') celsius = (value - 32) * 5/9;
            else celsius = value - 273.15;
            
            let result;
            if (to === 'c') result = celsius;
            else if (to === 'f') result = celsius * 9/5 + 32;
            else result = celsius + 273.15;
            
            document.getElementById('tempResult').textContent = result.toFixed(2) + '°' + to.toUpperCase();
        };

        window.convertUnit = function() {
            const value = parseFloat(document.getElementById('unitValue').value);
            const from = document.getElementById('unitFrom').value;
            const to = document.getElementById('unitTo').value;
            const toMeters = { m: 1, km: 1000, cm: 0.01, ft: 0.3048 };
            const result = value * toMeters[from] / toMeters[to];
            document.getElementById('unitResult').textContent = result.toFixed(4) + ' ' + to;
        };

        window.convertBinaryToText = function() {
            const binary = document.getElementById('binaryInput').value;
            const text = binary.split(' ').map(function(b) { return String.fromCharCode(parseInt(b, 2)); }).join('');
            document.getElementById('binaryToTextResult').textContent = text;
        };

        window.convertTextToBinary = function() {
            const text = document.getElementById('textForBinary').value;
            const binary = text.split('').map(function(ch) { return ch.charCodeAt(0).toString(2).padStart(8, '0'); }).join(' ');
            document.getElementById('textToBinaryResult').textContent = binary;
        };

        window.convertHexToRGB = function() {
            const hex = document.getElementById('hexInput').value.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            document.getElementById('hexToRgbResult').textContent = 'rgb(' + r + ', ' + g + ', ' + b + ')';
        };

        window.convertRGBToHex = function() {
            const r = parseInt(document.getElementById('rInput').value) || 0;
            const g = parseInt(document.getElementById('gInput').value) || 0;
            const b = parseInt(document.getElementById('bInput').value) || 0;
            const hex = '#' + [r, g, b].map(function(x) { return x.toString(16).padStart(2, '0'); }).join('');
            document.getElementById('rgbToHexResult').textContent = hex;
        };

        window.convertDecToBinary = function() {
            const decimal = parseInt(document.getElementById('decInput').value);
            document.getElementById('decToBinaryResult').textContent = decimal.toString(2);
        };

        window.convertBinToDec = function() {
            const binary = document.getElementById('binDecInput').value;
            document.getElementById('binToDecResult').textContent = parseInt(binary, 2);
        };

        window.convertToRoman = function() {
            const num = parseInt(document.getElementById('romanInput').value);
            const romanNumerals = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
            let result = '';
            let remaining = num;
            romanNumerals.forEach(function(item) {
                while (remaining >= item[0]) {
                    result += item[1];
                    remaining -= item[0];
                }
            });
            document.getElementById('romanResult').textContent = result;
        };

        window.generateRandomNumber = function() {
            const min = parseInt(document.getElementById('minNum').value);
            const max = parseInt(document.getElementById('maxNum').value);
            const random = Math.floor(Math.random() * (max - min + 1)) + min;
            document.getElementById('randomResult').textContent = random;
        };

        window.generateRandomName = function() {
            const firstNames = ['আরিফ', 'সাব্বির', 'তানভীর', 'রাকিব', 'নাদিম', 'ফাহিম', 'সাকিব', 'ইমরান', 'রাশেদ', 'মেহেদী'];
            const lastNames = ['আহমেদ', 'হোসেন', 'রহমান', 'ইসলাম', 'খান', 'চৌধুরী', 'শেখ', 'মিয়া', 'সরকার', 'তালুকদার'];
            const first = firstNames[Math.floor(Math.random() * firstNames.length)];
            const last = lastNames[Math.floor(Math.random() * lastNames.length)];
            document.getElementById('randomNameResult').textContent = first + ' ' + last;
        };

        window.updateColor = function() {
            const hex = document.getElementById('colorInput').value;
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            document.getElementById('hexValue').textContent = hex;
            document.getElementById('rgbValue').textContent = 'rgb(' + r + ', ' + g + ', ' + b + ')';
        };

        window.generatePalette = function() {
            const container = document.getElementById('paletteResult');
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const color = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
                const div = document.createElement('div');
                div.className = 'h-32 rounded-lg cursor-pointer transition hover:scale-105';
                div.style.backgroundColor = color;
                div.title = color;
                div.onclick = function() { navigator.clipboard.writeText(color); alert('কপি করা হয়েছে: ' + color); };
                container.appendChild(div);
            }
        };

        window.convertTimezone = function() {
            const time = new Date(document.getElementById('tzTime').value);
            const from = document.getElementById('tzFrom').value;
            const to = document.getElementById('tzTo').value;
            const fromDate = new Date(time.toLocaleString('en-US', { timeZone: from }));
            const toDate = new Date(time.toLocaleString('en-US', { timeZone: to }));
            const diff = toDate - fromDate;
            const result = new Date(time.getTime() + diff);
            document.getElementById('tzResult').textContent = 'রূপান্তরিত সময়: ' + result.toLocaleString();
        };

        window.calculateDate = function() {
            const date = new Date(document.getElementById('dateInput').value);
            const operation = document.getElementById('dateOperation').value;
            const days = parseInt(document.getElementById('dateDays').value);
            if (operation === 'add') date.setDate(date.getDate() + days);
            else date.setDate(date.getDate() - days);
            document.getElementById('dateResult').textContent = 'ফলাফল: ' + date.toLocaleDateString('bn-BD');
        };

        window.calculateDaysBetween = function() {
            const start = new Date(document.getElementById('daysStart').value);
            const end = new Date(document.getElementById('daysEnd').value);
            const diff = Math.abs(end - start);
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            document.getElementById('daysBetweenResult').textContent = days + ' দিন';
        };

        window.generate2FACode = function() {
            const length = parseInt(document.getElementById('codeLength').value) || 6;
            let code = '';
            for (let i = 0; i < length; i++) {
                code += Math.floor(Math.random() * 10);
            }
            document.getElementById('twoFactorCode').textContent = code;
            document.getElementById('codeExpiry').textContent = 'এই কোডটি 30 সেকেন্ডের মধ্যে মেয়াদ শেষ হবে';
            
            setTimeout(function() {
                document.getElementById('twoFactorCode').textContent = '------';
                document.getElementById('codeExpiry').textContent = 'কোডের মেয়াদ শেষ হয়েছে';
            }, 30000);
        };

        window.processGenericTool = function() {
            const input = document.getElementById('genericInput').value;
            document.getElementById('genericResult').textContent = 'প্রসেস করা হয়েছে: ' + input;
        };

        // Stopwatch
        let swInterval, swSeconds = 0, swRunning = false;
        window.startStopwatch = function() {
            if (!swRunning) {
                swRunning = true;
                swInterval = setInterval(function() {
                    swSeconds++;
                    const h = Math.floor(swSeconds / 3600);
                    const m = Math.floor((swSeconds % 3600) / 60);
                    const s = swSeconds % 60;
                    document.getElementById('stopwatchDisplay').textContent = 
                        String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                }, 1000);
            }
        };
        window.pauseStopwatch = function() {
            swRunning = false;
            clearInterval(swInterval);
        };
        window.resetStopwatch = function() {
            swRunning = false;
            clearInterval(swInterval);
            swSeconds = 0;
            document.getElementById('stopwatchDisplay').textContent = '00:00:00';
        };

        // Countdown
        let cdInterval;
        window.startCountdown = function() {
            clearInterval(cdInterval);
            let total = (parseInt(document.getElementById('cdMinutes').value) || 0) * 60 + (parseInt(document.getElementById('cdSeconds').value) || 0);
            cdInterval = setInterval(function() {
                if (total > 0) {
                    total--;
                    const m = Math.floor(total / 60);
                    const s = total % 60;
                    document.getElementById('countdownDisplay').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                } else {
                    clearInterval(cdInterval);
                    alert('সময় শেষ!');
                }
            }, 1000);
        };

        // Counter
        let counterValue = 0;
        window.incrementCounter = function() { counterValue++; document.getElementById('counterDisplay').textContent = counterValue; };
        window.decrementCounter = function() { counterValue--; document.getElementById('counterDisplay').textContent = counterValue; };
        window.resetCounter = function() { counterValue = 0; document.getElementById('counterDisplay').textContent = counterValue; };

        // Calculator
        let calcExpression = '';
        window.calcInput = function(value) { calcExpression += value; document.getElementById('calcDisplay').value = calcExpression; };
        window.calcCalculate = function() { try { const result = eval(calcExpression); document.getElementById('calcDisplay').value = result; calcExpression = result.toString(); } catch (e) { document.getElementById('calcDisplay').value = 'Error'; calcExpression = ''; } };
        window.calcClear = function() { calcExpression = ''; document.getElementById('calcDisplay').value = ''; };
        window.calcBackspace = function() { calcExpression = calcExpression.slice(0, -1); document.getElementById('calcDisplay').value = calcExpression; };

        // ============================================
        // পেজ লোড
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const slug = getToolSlug();
            console.log('স্লাগ:', slug);
            if (slug) {
                loadTool(slug);
            } else {
                window.location.href = '/tools.html';
            }
        });
    </script>
</body>
</html>

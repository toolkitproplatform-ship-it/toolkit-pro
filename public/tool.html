<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolkit Pro - টুল</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background-color: #f8fafc; }
        .bg-gradient-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body>

    <!-- নেভিগেশন -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold">🧰 Toolkit <span class="text-blue-600">Pro</span></a>
            <div class="flex gap-4">
                <a href="/" class="text-gray-700 hover:text-blue-600">হোম</a>
                <a href="/tools.html" class="text-gray-700 hover:text-blue-600">সব টুলস</a>
            </div>
        </div>
    </nav>

    <!-- মূল কন্টেন্ট -->
    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- লোডিং -->
        <div id="loading" class="text-center py-20">
            <div class="inline-block w-10 h-10 border-3 border-gray-300 border-t-blue-600 rounded-full animate-spin"></div>
            <p class="text-gray-600 mt-4">টুল লোড হচ্ছে...</p>
        </div>

        <!-- টুল কন্টেন্ট -->
        <div id="toolContent" class="hidden">
            <!-- টুল হেডার -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden mb-6">
                <div class="bg-gradient-primary text-white p-8">
                    <div class="flex items-center gap-4">
                        <span id="toolIcon" class="text-5xl bg-white/20 rounded-xl p-4">🔧</span>
                        <div>
                            <h1 id="toolName" class="text-3xl font-bold">টুল</h1>
                            <p id="toolDescription" class="text-white/80 mt-1">বিবরণ লোড হচ্ছে...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- টুল ফাংশনালিটি -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <div id="toolFunctionality">
                    <!-- ফাংশন এখানে লোড হবে -->
                </div>
            </div>
        </div>

        <!-- এরর -->
        <div id="errorMessage" class="hidden text-center py-20">
            <div class="text-6xl mb-4">⚠️</div>
            <h2 class="text-2xl font-bold text-gray-700">টুল লোড করা যায়নি</h2>
            <p class="text-gray-500 mt-2" id="errorText"></p>
            <a href="/tools.html" class="inline-block mt-6 px-6 py-3 bg-blue-600 text-white rounded-lg">সব টুল দেখুন</a>
        </div>
    </main>

    <script>
        // ============================================
        // URL থেকে স্লাগ পাওয়া
        // ============================================
        function getSlug() {
            const params = new URLSearchParams(window.location.search);
            return params.get('slug') || '';
        }

        // ============================================
        // টুল ডেটা (API ছাড়াই সরাসরি)
        // ============================================
        const toolsData = {
            'word-counter': { name: 'Word Counter', icon: '📝', description: 'শব্দ গণনা করুন', func: createWordCounter },
            'character-counter': { name: 'Character Counter', icon: '🔤', description: 'অক্ষর গণনা করুন', func: createCharacterCounter },
            'case-converter': { name: 'Case Converter', icon: '🔠', description: 'কেস পরিবর্তন করুন', func: createCaseConverter },
            'text-reverser': { name: 'Text Reverser', icon: '🔄', description: 'টেক্সট উল্টান', func: createTextReverser },
            'json-formatter': { name: 'JSON Formatter', icon: '💻', description: 'JSON ফরম্যাট করুন', func: createJSONFormatter },
            'json-validator': { name: 'JSON Validator', icon: '✅', description: 'JSON ভ্যালিডেট করুন', func: createJSONValidator },
            'uuid-generator': { name: 'UUID Generator', icon: '🔑', description: 'UUID তৈরি করুন', func: createUUIDGenerator },
            'base64-encoder': { name: 'Base64 Encoder', icon: '🔐', description: 'Base64 এনকোড করুন', func: createBase64Encoder },
            'base64-decoder': { name: 'Base64 Decoder', icon: '🔓', description: 'Base64 ডিকোড করুন', func: createBase64Decoder },
            'url-encoder': { name: 'URL Encoder', icon: '🔗', description: 'URL এনকোড করুন', func: createUrlEncoder },
            'url-decoder': { name: 'URL Decoder', icon: '🔓', description: 'URL ডিকোড করুন', func: createUrlDecoder },
            'password-generator': { name: 'Password Generator', icon: '🔐', description: 'পাসওয়ার্ড তৈরি করুন', func: createPasswordGenerator },
            'password-strength-checker': { name: 'Password Strength Checker', icon: '💪', description: 'পাসওয়ার্ড চেক করুন', func: createPasswordStrengthChecker },
            'two-factor-generator': { name: '2FA Generator', icon: '🔐', description: '2FA কোড তৈরি করুন', func: create2FAGenerator },
            'otp-generator': { name: 'OTP Generator', icon: '🔐', description: 'OTP কোড তৈরি করুন', func: create2FAGenerator },
            '2fa-generator': { name: '2FA Generator', icon: '🔐', description: '2FA কোড তৈরি করুন', func: create2FAGenerator },
            'email-validator': { name: 'Email Validator', icon: '📧', description: 'ইমেইল ভ্যালিডেট করুন', func: createEmailValidator },
            'phone-validator': { name: 'Phone Validator', icon: '📱', description: 'ফোন ভ্যালিডেট করুন', func: createPhoneValidator },
            'bmi-calculator': { name: 'BMI Calculator', icon: '⚖️', description: 'BMI গণনা করুন', func: createBMICalculator },
            'age-calculator': { name: 'Age Calculator', icon: '🎂', description: 'বয়স গণনা করুন', func: createAgeCalculator },
            'percentage-calculator': { name: 'Percentage Calculator', icon: '📊', description: 'শতাংশ গণনা করুন', func: createPercentageCalculator },
            'discount-calculator': { name: 'Discount Calculator', icon: '🏷️', description: 'ছাড় গণনা করুন', func: createDiscountCalculator },
            'tip-calculator': { name: 'Tip Calculator', icon: '💝', description: 'টিপ গণনা করুন', func: createTipCalculator },
            'loan-calculator': { name: 'Loan Calculator', icon: '🏦', description: 'লোন গণনা করুন', func: createLoanCalculator },
            'factorial-calculator': { name: 'Factorial Calculator', icon: '🔢', description: 'ফ্যাক্টোরিয়াল গণনা', func: createFactorialCalculator },
            'square-root-calculator': { name: 'Square Root Calculator', icon: '√', description: 'বর্গমূল গণনা', func: createSquareRootCalculator },
            'temperature-converter': { name: 'Temperature Converter', icon: '🌡️', description: 'তাপমাত্রা রূপান্তর', func: createTemperatureConverter },
            'unit-converter': { name: 'Unit Converter', icon: '📏', description: 'ইউনিট রূপান্তর', func: createUnitConverter },
            'binary-to-text': { name: 'Binary to Text', icon: '🔢', description: 'বাইনারি থেকে টেক্সট', func: createBinaryToText },
            'text-to-binary': { name: 'Text to Binary', icon: '🔤', description: 'টেক্সট থেকে বাইনারি', func: createTextToBinary },
            'hex-to-rgb': { name: 'HEX to RGB', icon: '🎨', description: 'HEX থেকে RGB', func: createHexToRgb },
            'rgb-to-hex': { name: 'RGB to HEX', icon: '🎨', description: 'RGB থেকে HEX', func: createRgbToHex },
            'random-number-generator': { name: 'Random Number Generator', icon: '🎲', description: 'র্যান্ডম সংখ্যা', func: createRandomNumberGenerator },
            'random-name-generator': { name: 'Random Name Generator', icon: '👤', description: 'র্যান্ডম নাম', func: createRandomNameGenerator },
            'stopwatch': { name: 'Stopwatch', icon: '⏱️', description: 'স্টপওয়াচ', func: createStopwatch },
            'countdown-timer': { name: 'Countdown Timer', icon: '⏳', description: 'কাউন্টডাউন টাইমার', func: createCountdownTimer },
            'counter': { name: 'Counter', icon: '🔢', description: 'কাউন্টার', func: createCounter },
            'color-picker': { name: 'Color Picker', icon: '🎨', description: 'রঙ নির্বাচন', func: createColorPicker },
            'gradient-generator': { name: 'Gradient Generator', icon: '🌈', description: 'গ্রেডিয়েন্ট তৈরি', func: createGradientGenerator },
            'prime-checker': { name: 'Prime Number Checker', icon: '🔢', description: 'মৌলিক সংখ্যা চেক', func: createPrimeChecker },
            'gcd-calculator': { name: 'GCD Calculator', icon: '🔢', description: 'গসাগু গণনা', func: createGcdCalculator },
            'lcm-calculator': { name: 'LCM Calculator', icon: '🔢', description: 'লসাগু গণনা', func: createLcmCalculator }
        };

        // ============================================
        // টুল লোড
        // ============================================
        function loadTool(slug) {
            console.log('Loading tool:', slug);
            
            const tool = toolsData[slug];
            
            if (tool) {
                // টুল পাওয়া গেছে
                document.title = 'Toolkit Pro - ' + tool.name;
                document.getElementById('toolName').textContent = tool.name;
                document.getElementById('toolDescription').textContent = tool.description;
                document.getElementById('toolIcon').textContent = tool.icon;
                
                // ফাংশনালিটি লোড
                document.getElementById('toolFunctionality').innerHTML = tool.func();
                
                // দেখান
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('toolContent').classList.remove('hidden');
                
                console.log('Tool loaded successfully:', tool.name);
            } else {
                // টুল পাওয়া যায়নি - স্লাগ থেকে নাম তৈরি
                const name = slug.split('-').map(function(word) {
                    return word.charAt(0).toUpperCase() + word.slice(1);
                }).join(' ');
                
                document.title = 'Toolkit Pro - ' + name;
                document.getElementById('toolName').textContent = name;
                document.getElementById('toolDescription').textContent = name + ' - ফ্রি অনলাইন টুল';
                document.getElementById('toolIcon').textContent = '🔧';
                
                // জেনেরিক ফাংশনালিটি
                document.getElementById('toolFunctionality').innerHTML = createGenericTool(name);
                
                // দেখান
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('toolContent').classList.remove('hidden');
                
                console.log('Generic tool loaded:', name);
            }
        }

        // ============================================
        // জেনেরিক টুল
        // ============================================
        function createGenericTool(name) {
            return '<div class="text-center py-12">' +
                '<div class="text-6xl mb-4">🔧</div>' +
                '<h3 class="text-2xl font-bold text-gray-900">' + name + '</h3>' +
                '<p class="text-gray-600 mt-2">' + name + ' - ফ্রি অনলাইন টুল</p>' +
                '<div class="bg-gray-50 rounded-xl p-6 max-w-2xl mx-auto mt-6">' +
                '<textarea id="genericInput" class="w-full p-4 border rounded-lg mb-4" rows="4" placeholder="আপনার ইনপুট লিখুন..."></textarea>' +
                '<button onclick="processGeneric()" class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition">প্রসেস করুন</button>' +
                '<div class="mt-4 p-4 bg-white border rounded-lg"><p id="genericResult">রেজাল্ট এখানে দেখানো হবে...</p></div>' +
                '</div></div>';
        }

        // ============================================
        // টুল ফাংশনসমূহ
        // ============================================
        function createWordCounter() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">📝 Word Counter</h3>' +
                '<textarea id="textInput" class="w-full p-4 border rounded-lg" rows="6" placeholder="টেক্সট লিখুন..." oninput="countWords()"></textarea>' +
                '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">' +
                '<div class="bg-blue-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold" id="wordCount">0</p><p class="text-sm">শব্দ</p></div>' +
                '<div class="bg-green-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold" id="charCount">0</p><p class="text-sm">অক্ষর</p></div>' +
                '<div class="bg-purple-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold" id="sentenceCount">0</p><p class="text-sm">বাক্য</p></div>' +
                '<div class="bg-orange-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold" id="paragraphCount">0</p><p class="text-sm">প্যারাগ্রাফ</p></div>' +
                '</div></div>';
        }

        function createCharacterCounter() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">🔤 Character Counter</h3>' +
                '<textarea id="charInput" class="w-full p-4 border rounded-lg" rows="6" placeholder="টেক্সট লিখুন..." oninput="countChars()"></textarea>' +
                '<div class="grid grid-cols-3 gap-4">' +
                '<div class="bg-blue-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold" id="totalChars">0</p><p class="text-sm">মোট</p></div>' +
                '<div class="bg-green-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold" id="noSpaceChars">0</p><p class="text-sm">স্পেস ছাড়া</p></div>' +
                '<div class="bg-purple-50 p-4 rounded-lg text-center"><p class="text-2xl font-bold" id="lineCount">0</p><p class="text-sm">লাইন</p></div>' +
                '</div></div>';
        }

        function createCaseConverter() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">🔠 Case Converter</h3>' +
                '<textarea id="caseInput" class="w-full p-4 border rounded-lg" rows="4" placeholder="টেক্সট লিখুন..."></textarea>' +
                '<div class="grid grid-cols-2 gap-3">' +
                '<button onclick="convertCase(\'upper\')" class="bg-blue-600 text-white px-4 py-2 rounded-lg">UPPERCASE</button>' +
                '<button onclick="convertCase(\'lower\')" class="bg-green-600 text-white px-4 py-2 rounded-lg">lowercase</button>' +
                '<button onclick="convertCase(\'title\')" class="bg-purple-600 text-white px-4 py-2 rounded-lg">Title Case</button>' +
                '<button onclick="convertCase(\'sentence\')" class="bg-orange-600 text-white px-4 py-2 rounded-lg">Sentence case</button>' +
                '</div>' +
                '<div class="result-box bg-gray-50 p-4 rounded-lg"><p id="caseResult">রেজাল্ট এখানে দেখাবে...</p></div></div>';
        }

        function createTextReverser() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">🔄 Text Reverser</h3>' +
                '<textarea id="reverseInput" class="w-full p-4 border rounded-lg" rows="4" placeholder="টেক্সট লিখুন..."></textarea>' +
                '<button onclick="reverseText()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">রিভার্স করুন</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg"><p id="reverseResult">রেজাল্ট এখানে দেখাবে...</p></div></div>';
        }

        function createJSONFormatter() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">💻 JSON Formatter</h3>' +
                '<textarea id="jsonInput" class="w-full p-4 border rounded-lg font-mono" rows="6" placeholder=\'{"key": "value"}\'></textarea>' +
                '<button onclick="formatJSON()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">Format</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg"><pre id="jsonResult"></pre></div></div>';
        }

        function createJSONValidator() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">✅ JSON Validator</h3>' +
                '<textarea id="jsonValidateInput" class="w-full p-4 border rounded-lg font-mono" rows="6" placeholder=\'{"key": "value"}\'></textarea>' +
                '<button onclick="validateJSON()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">ভ্যালিডেট</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg"><p id="jsonValidateResult" class="text-center font-semibold"></p></div></div>';
        }

        function createUUIDGenerator() {
            return '<div class="space-y-4 text-center">' +
                '<h3 class="text-xl font-bold">🔑 UUID Generator</h3>' +
                '<button onclick="generateUUID()" class="bg-blue-600 text-white px-8 py-3 rounded-lg">জেনারেট করুন</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg mt-4"><p id="uuidResult" class="text-lg font-mono">------</p></div></div>';
        }

        function createBase64Encoder() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">🔐 Base64 Encoder</h3>' +
                '<textarea id="b64EncodeInput" class="w-full p-4 border rounded-lg" rows="4" placeholder="টেক্সট লিখুন..."></textarea>' +
                '<button onclick="encodeBase64()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">এনকোড</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg"><p id="b64EncodeResult" class="font-mono break-all"></p></div></div>';
        }

        function createBase64Decoder() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">🔓 Base64 Decoder</h3>' +
                '<textarea id="b64DecodeInput" class="w-full p-4 border rounded-lg font-mono" rows="4" placeholder="Base64 স্ট্রিং..."></textarea>' +
                '<button onclick="decodeBase64()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">ডিকোড</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg"><p id="b64DecodeResult" class="break-all"></p></div></div>';
        }

        function createUrlEncoder() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">🔗 URL Encoder</h3>' +
                '<textarea id="urlEncodeInput" class="w-full p-4 border rounded-lg" rows="4" placeholder="URL লিখুন..."></textarea>' +
                '<button onclick="encodeURL()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">এনকোড</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg"><p id="urlEncodeResult" class="font-mono break-all"></p></div></div>';
        }

        function createUrlDecoder() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">🔓 URL Decoder</h3>' +
                '<textarea id="urlDecodeInput" class="w-full p-4 border rounded-lg font-mono" rows="4" placeholder="এনকোডেড URL..."></textarea>' +
                '<button onclick="decodeURL()" class="bg-blue-600 text-white px-6 py-2 rounded-lg">ডিকোড</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg"><p id="urlDecodeResult" class="font-mono break-all"></p></div></div>';
        }

        function createPasswordGenerator() {
            return '<div class="space-y-4 text-center">' +
                '<h3 class="text-xl font-bold">🔐 Password Generator</h3>' +
                '<div class="grid grid-cols-2 gap-4 max-w-md mx-auto">' +
                '<div><label class="block text-sm mb-1">দৈর্ঘ্য</label><input type="number" id="passLength" value="12" min="4" max="50" class="w-full p-2 border rounded"></div>' +
                '<div><label class="block text-sm mb-1">ধরন</label><select id="passType" class="w-full p-2 border rounded"><option value="all">সব</option><option value="alpha">বর্ণ</option><option value="alphanumeric">বর্ণ+সংখ্যা</option></select></div>' +
                '</div>' +
                '<button onclick="generatePassword()" class="bg-blue-600 text-white px-8 py-3 rounded-lg">জেনারেট করুন</button>' +
                '<div class="bg-gray-50 p-4 rounded-lg mt-4"><p id="passwordResult" class="text-2xl font-bold font-mono">------</p></div></div>';
        }

        function createPasswordStrengthChecker() {
            return '<div class="space-y-4">' +
                '<h3 class="text-xl font-bold">💪 Password Strength Checker</h3>' +
                '<input type="password" id="passInput" class="w-full p-4 border rounded-lg" placeholder="পাসওয়ার্ড লিখুন..." oninput="checkPasswordStrength()">' +
                '<div class="w-full h-2 bg-gray-200 rounded-full"><div id="strengthBar" class="h-full bg-red-500" style="width:0%"></div></div>' +
                '<p id="strengthText" class="text-center font-semibold"></p></div>';
        }

        function create2FAGenerator() {
            return '<div class="space-y-4 text-center">' +

        window.countWords = function() {
            const text = document.getElementById('textInput').value;
            document.getElementById('wordCount').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('charCount').textContent = text.length;
            document.getElementById('sentenceCount').textContent = text.split(/[.!?]+/).filter(function(s) { return s.trim(); }).length;
            document.getElementById('paragraphCount').textContent = text.split(/\n\n+/).filter(function(p) { return p.trim(); }).length;
        };

        window.countChars = function() {
            const text = document.getElementById('charInput').value;
            document.getElementById('totalChars').textContent = text.length;
            document.getElementById('noSpaceChars').textContent = text.replace(/\s/g, '').length;
            document.getElementById('lineCount').textContent = text.split('\n').length;
        };

        window.convertCase = function(type) {
            const text = document.getElementById('caseInput').value;
            let result = '';
            if (type === 'upper') result = text.toUpperCase();
            else if (type === 'lower') result = text.toLowerCase();
            else if (type === 'title') result = text.replace(/\w\S*/g, function(w) { return w[0].toUpperCase() + w.slice(1).toLowerCase(); });
            else if (type === 'sentence') result = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, function(c) { return c.toUpperCase(); });
            document.getElementById('caseResult').textContent = result;
        };

        window.reverseText = function() {
            const text = document.getElementById('reverseInput').value;
            document.getElementById('reverseResult').textContent = text.split('').reverse().join('');
        };

        window.formatJSON = function() {
            try {
                const json = JSON.parse(document.getElementById('jsonInput').value);
                document.getElementById('jsonResult').textContent = JSON.stringify(json, null, 2);
                document.getElementById('jsonResult').className = 'text-green-600';
            } catch (e) {
                document.getElementById('jsonResult').textContent = 'Error: ' + e.message;
                document.getElementById('jsonResult').className = 'text-red-600';
            }
        };

        window.validateJSON = function() {
            try {
                JSON.parse(document.getElementById('jsonValidateInput').value);
                document.getElementById('jsonValidateResult').textContent = '✅ ভ্যালিড JSON!';
                document.getElementById('jsonValidateResult').className = 'text-green-600';
            } catch (e) {
                document.getElementById('jsonValidateResult').textContent = '❌ ইনভ্যালিড: ' + e.message;
                document.getElementById('jsonValidateResult').className = 'text-red-600';
            }
        };

        window.generateUUID = function() {
            const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
            document.getElementById('uuidResult').textContent = uuid;
        };

        window.encodeBase64 = function() {
            const text = document.getElementById('b64EncodeInput').value;
            document.getElementById('b64EncodeResult').textContent = btoa(unescape(encodeURIComponent(text)));
        };

        window.decodeBase64 = function() {
            const base64 = document.getElementById('b64DecodeInput').value;
            try {
                document.getElementById('b64DecodeResult').textContent = decodeURIComponent(escape(atob(base64)));
            } catch (e) {
                document.getElementById('b64DecodeResult').textContent = 'Error: ' + e.message;
            }
        };

        window.encodeURL = function() {
            document.getElementById('urlEncodeResult').textContent = encodeURIComponent(document.getElementById('urlEncodeInput').value);
        };

        window.decodeURL = function() {
            try {
                document.getElementById('urlDecodeResult').textContent = decodeURIComponent(document.getElementById('urlDecodeInput').value);
            } catch (e) {
                document.getElementById('urlDecodeResult').textContent = 'Error: ' + e.message;
            }
        };

        window.generatePassword = function() {
            const length = parseInt(document.getElementById('passLength').value);
            const type = document.getElementById('passType').value;
            let chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()';
            if (type === 'alpha') chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
            else if (type === 'alphanumeric') chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('passwordResult').textContent = password;
        };

        window.checkPasswordStrength = function() {
            const password = document.getElementById('passInput').value;
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;
            
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            if (score <= 1) { bar.style.width = '20%'; bar.className = 'h-full bg-red-500'; text.textContent = 'খুব দুর্বল'; }
            else if (score <= 2) { bar.style.width = '40%'; bar.className = 'h-full bg-orange-500'; text.textContent = 'দুর্বল'; }
            else if (score <= 3) { bar.style.width = '60%'; bar.className = 'h-full bg-yellow-500'; text.textContent = 'মোটামুটি'; }
            else if (score <= 4) { bar.style.width = '80%'; bar.className = 'h-full bg-green-500'; text.textContent = 'শক্তিশালী'; }
            else { bar.style.width = '100%'; bar.className = 'h-full bg-blue-500'; text.textContent = 'খুব শক্তিশালী'; }
        };

        window.generate2FA = function() {
            const length = parseInt(document.getElementById('codeLength').value) || 6;
            let code = '';
            for (let i = 0; i < length; i++) {
                code += Math.floor(Math.random() * 10);
            }
            document.getElementById('twoFactorResult').textContent = code;
            document.getElementById('codeExpiry').textContent = 'এই কোডটি 30 সেকেন্ডের মধ্যে মেয়াদ শেষ হবে';
        };

        window.validateEmail = function() {
            const email = document.getElementById('emailInput').value;
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const result = regex.test(email);
            document.getElementById('emailResult').textContent = result ? '✅ ভ্যালিড ইমেইল!' : '❌ ইনভ্যালিড ইমেইল!';
            document.getElementById('emailResult').className = result ? 'text-green-600' : 'text-red-600';
        };

        window.validatePhone = function() {
            const phone = document.getElementById('phoneInput').value;
            const regex = /^[\+]?[\d\s-]{10,15}$/;
            const result = regex.test(phone);
            document.getElementById('phoneResult').textContent = result ? '✅ ভ্যালিড ফোন!' : '❌ ইনভ্যালিড ফোন!';
            document.getElementById('phoneResult').className = result ? 'text-green-600' : 'text-red-600';
        };

        window.calculateBMI = function() {
            const weight = parseFloat(document.getElementById('bmiWeight').value);
            const heightCm = parseFloat(document.getElementById('bmiHeight').value);
            const heightM = heightCm / 100;
            const bmi = weight / (heightM * heightM);
            
            let category;
            if (bmi < 18.5) category = 'কম ওজন';
            else if (bmi < 25) category = 'স্বাভাবিক ওজন';
            else if (bmi < 30) category = 'অতিরিক্ত ওজন';
            else category = 'স্থূলতা';
            
            document.getElementById('bmiResult').textContent = 'BMI: ' + bmi.toFixed(1);
            document.getElementById('bmiCategory').textContent = category;
        };

        window.calculateAge = function() {
            const birth = new Date(document.getElementById('birthDate').value);
            const now = new Date();
            
            let years = now.getFullYear() - birth.getFullYear();
            let months = now.getMonth() - birth.getMonth();
            let days = now.getDate() - birth.getDate();
            
            if (days < 0) { months--; days += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
            if (months < 0) { years--; months += 12; }
            
            document.getElementById('ageResult').textContent = years + ' বছর, ' + months + ' মাস, ' + days + ' দিন';
        };

        window.calculatePercentage = function() {
            const total = parseFloat(document.getElementById('percentTotal').value);
            const percent = parseFloat(document.getElementById('percentValue').value);
            const result = (total * percent) / 100;
            document.getElementById('percentResult').textContent = percent + '% of ' + total + ' = ' + result;
        };

        window.calculateDiscount = function() {
            const price = parseFloat(document.getElementById('discountPrice').value);
            const percent = parseFloat(document.getElementById('discountPercent').value);
            const discount = price * percent / 100;
            const final = price - discount;
            document.getElementById('discountResult').textContent = 'ছাড়: ' + discount.toFixed(2) + ' | চূড়ান্ত: ' + final.toFixed(2);
        };

        window.calculateTip = function() {
            const bill = parseFloat(document.getElementById('tipBill').value);
            const percent = parseFloat(document.getElementById('tipPercent').value);
            const tip = bill * percent / 100;
            document.getElementById('tipResult').textContent = 'টিপ: ' + tip.toFixed(2) + ' | মোট: ' + (bill + tip).toFixed(2);
        };

        window.calculateLoan = function() {
            const amount = parseFloat(document.getElementById('loanAmount').value);
            const annualRate = parseFloat(document.getElementById('loanRate').value);
            const months = parseInt(document.getElementById('loanTerm').value);
            const monthlyRate = annualRate / 12 / 100;
            const emi = amount * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
            document.getElementById('loanResult').textContent = 'মাসিক EMI: ' + emi.toFixed(2) + ' টাকা';
        };

        window.calculateFactorial = function() {
            const num = parseInt(document.getElementById('factorialInput').value);
            let result = 1;
            for (let i = 2; i <= num; i++) result *= i;
            document.getElementById('factorialResult').textContent = num + '! = ' + result;
        };

        window.calculateSqrt = function() {
            const num = parseFloat(document.getElementById('sqrtInput').value);
            document.getElementById('sqrtResult').textContent = '√' + num + ' = ' + Math.sqrt(num).toFixed(4);
        };

        window.convertTemperature = function() {
            const value = parseFloat(document.getElementById('tempValue').value);
            const from = document.getElementById('tempFrom').value;
            const to = document.getElementById('tempTo').value;
            
            let celsius;
            if (from === 'c') celsius = value;
            else if (from === 'f') celsius = (value - 32) * 5/9;
            else celsius = value - 273.15;
            
            let result;
            if (to === 'c') result = celsius;
            else if (to === 'f') result = celsius * 9/5 + 32;
            else result = celsius + 273.15;
            
            document.getElementById('tempResult').textContent = result.toFixed(2) + '°' + to.toUpperCase();
        };

        window.convertUnit = function() {
            const value = parseFloat(document.getElementById('unitValue').value);
            const from = document.getElementById('unitFrom').value;
            const to = document.getElementById('unitTo').value;
            const toMeters = { m: 1, km: 1000, cm: 0.01, ft: 0.3048 };
            const result = value * toMeters[from] / toMeters[to];
            document.getElementById('unitResult').textContent = result.toFixed(4) + ' ' + to;
        };

        window.convertBinaryToText = function() {
            const binary = document.getElementById('binaryInput').value;
            const text = binary.split(' ').map(function(b) { return String.fromCharCode(parseInt(b, 2)); }).join('');
            document.getElementById('binaryToTextResult').textContent = text;
        };

        window.convertTextToBinary = function() {
            const text = document.getElementById('textForBinary').value;
            const binary = text.split('').map(function(ch) { return ch.charCodeAt(0).toString(2).padStart(8, '0'); }).join(' ');
            document.getElementById('textToBinaryResult').textContent = binary;
        };

        window.convertHexToRGB = function() {
            const hex = document.getElementById('hexInput').value.replace('#', '');
            const r = parseInt(hex.substr(0, 2), 16);
            const g = parseInt(hex.substr(2, 2), 16);
            const b = parseInt(hex.substr(4, 2), 16);
            document.getElementById('hexToRgbResult').textContent = 'rgb(' + r + ', ' + g + ', ' + b + ')';
        };

        window.convertRGBToHex = function() {
            const r = parseInt(document.getElementById('rInput').value) || 0;
            const g = parseInt(document.getElementById('gInput').value) || 0;
            const b = parseInt(document.getElementById('bInput').value) || 0;
            const hex = '#' + [r, g, b].map(function(x) { return x.toString(16).padStart(2, '0'); }).join('');
            document.getElementById('rgbToHexResult').textContent = hex;
        };

        window.generateRandomNumber = function() {
            const min = parseInt(document.getElementById('minNum').value);
            const max = parseInt(document.getElementById('maxNum').value);
            const random = Math.floor(Math.random() * (max - min + 1)) + min;
            document.getElementById('randomResult').textContent = random;
        };

        window.generateRandomName = function() {
            const firstNames = ['আরিফ', 'সাব্বির', 'তানভীর', 'রাকিব', 'নাদিম', 'ফাহিম', 'সাকিব'];
            const lastNames = ['আহমেদ', 'হোসেন', 'রহমান', 'ইসলাম', 'খান', 'চৌধুরী'];
            const first = firstNames[Math.floor(Math.random() * firstNames.length)];
            const last = lastNames[Math.floor(Math.random() * lastNames.length)];
            document.getElementById('randomNameResult').textContent = first + ' ' + last;
        };

        window.updateColor = function() {
            const hex = document.getElementById('colorInput').value;
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            document.getElementById('hexValue').textContent = hex;
            document.getElementById('rgbValue').textContent = 'rgb(' + r + ', ' + g + ', ' + b + ')';
        };

        window.updateGradient = function() {
            const c1 = document.getElementById('gradient1').value;
            const c2 = document.getElementById('gradient2').value;
            const css = 'linear-gradient(135deg, ' + c1 + ' 0%, ' + c2 + ' 100%)';
            document.getElementById('gradientPreview').style.background = css;
            document.getElementById('gradientCss').textContent = css;
        };

        window.checkPrime = function() {
            const num = parseInt(document.getElementById('primeInput').value);
            let isPrime = true;
            for (let i = 2; i <= Math.sqrt(num); i++) {
                if (num % i === 0) { isPrime = false; break; }
            }
            document.getElementById('primeResult').textContent = num + (isPrime ? ' মৌলিক সংখ্যা!' : ' মৌলিক নয়!');
        };

        window.calculateGCD = function() {
            let a = parseInt(document.getElementById('gcd1').value);
            let b = parseInt(document.getElementById('gcd2').value);
            while (b !== 0) { const temp = b; b = a % b; a = temp; }
            document.getElementById('gcdResult').textContent = 'GCD: ' + Math.abs(a);
        };

        window.calculateLCM = function() {
            const a = parseInt(document.getElementById('lcm1').value);
            const b = parseInt(document.getElementById('lcm2').value);
            let x = a, y = b;
            while (y !== 0) { const temp = y; y = x % y; x = temp; }
            const lcm = Math.abs(a * b) / x;
            document.getElementById('lcmResult').textContent = 'LCM: ' + lcm;
        };

        window.processGeneric = function() {
            const input = document.getElementById('genericInput').value;
            document.getElementById('genericResult').textContent = 'প্রসেস করা হয়েছে: ' + input;
        };

        // Stopwatch
        let swInterval, swSeconds = 0, swRunning = false;
        window.startStopwatch = function() {
            if (!swRunning) {
                swRunning = true;
                swInterval = setInterval(function() {
                    swSeconds++;
                    const h = Math.floor(swSeconds / 3600);
                    const m = Math.floor((swSeconds % 3600) / 60);
                    const s = swSeconds % 60;
                    document.getElementById('stopwatchDisplay').textContent = 
                        String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                }, 1000);
            }
        };
        window.pauseStopwatch = function() {
            swRunning = false;
            clearInterval(swInterval);
        };
        window.resetStopwatch = function() {
            swRunning = false;
            clearInterval(swInterval);
            swSeconds = 0;
            document.getElementById('stopwatchDisplay').textContent = '00:00:00';
        };

        // Countdown
        let cdInterval;
        window.startCountdown = function() {
            clearInterval(cdInterval);
            let total = (parseInt(document.getElementById('cdMinutes').value) || 0) * 60 + (parseInt(document.getElementById('cdSeconds').value) || 0);
            cdInterval = setInterval(function() {
                if (total > 0) {
                    total--;
                    const m = Math.floor(total / 60);
                    const s = total % 60;
                    document.getElementById('countdownDisplay').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
                } else {
                    clearInterval(cdInterval);
                    alert('সময় শেষ!');
                }
            }, 1000);
        };

        // Counter
        let counterValue = 0;
        window.incrementCounter = function() { counterValue++; document.getElementById('counterDisplay').textContent = counterValue; };
        window.decrementCounter = function() { counterValue--; document.getElementById('counterDisplay').textContent = counterValue; };
        window.resetCounter = function() { counterValue = 0; document.getElementById('counterDisplay').textContent = counterValue; };

        // ============================================
        // পেজ লোড
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            const slug = getSlug();
            if (slug) {
                loadTool(slug);
            } else {
                window.location.href = '/tools.html';
            }
        });
    </script>
</body>
</html>

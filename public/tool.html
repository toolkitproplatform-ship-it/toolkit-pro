<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool - Toolkit Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tools-data.js"></script>
</head>
<body class="bg-gray-50">

    <nav class="bg-white shadow-sm p-4">
        <div class="max-w-4xl mx-auto flex justify-between">
            <a href="/" class="font-bold text-xl">🧰 Toolkit Pro</a>
            <a href="/tools.html" class="text-blue-600">সব টুলস</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6">
        <div id="app">
            <p class="text-center py-10 text-gray-500">লোড হচ্ছে...</p>
        </div>
    </main>

    <script>
        // স্লাগ পাওয়া
        function getSlug() {
            var params = new URLSearchParams(window.location.search);
            return params.get('slug') || '';
        }

        // টুল লোড
        function init() {
            var slug = getSlug();
            var app = document.getElementById('app');
            
            console.log('🔍 Loading tool:', slug);
            
            if (!slug) {
                app.innerHTML = '<p class="text-center text-red-600">কোনো টুল নির্বাচন করা হয়নি</p>';
                return;
            }
            
            // tools-data.js থেকে টুল খুঁজুন
            var tool = null;
            if (typeof getToolBySlug === 'function') {
                tool = getToolBySlug(slug);
            } else if (typeof toolsDatabase !== 'undefined' && toolsDatabase[slug]) {
                tool = toolsDatabase[slug];
                tool.slug = slug;
            }
            
            if (!tool) {
                app.innerHTML = '<div class="text-center py-10">' +
                    '<p class="text-2xl font-bold text-red-600">টুল পাওয়া যায়নি: ' + slug + '</p>' +
                    '<a href="/tools.html" class="inline-block mt-4 px-6 py-2 bg-blue-600 text-white rounded">সব টুল দেখুন</a>' +
                    '</div>';
                return;
            }
            
            // টুল রেন্ডার
            document.title = tool.name + ' - Toolkit Pro';
            
            app.innerHTML = '<div class="bg-white rounded-lg shadow-lg overflow-hidden">' +
                '<div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-6">' +
                '<div class="flex items-center gap-4">' +
                '<span class="text-4xl">' + tool.icon + '</span>' +
                '<div>' +
                '<h1 class="text-2xl font-bold">' + tool.name + '</h1>' +
                '<p class="text-white/80">' + tool.description + '</p>' +
                '</div></div></div>' +
                '<div class="p-6" id="toolArea">' +
                renderTool(slug, tool) +
                '</div></div>';
        }

        // টুল UI
        function renderTool(slug, tool) {
            var type = tool.type || 'text';
            
            if (type === 'text') {
                return '<textarea id="input" class="w-full p-4 border rounded-lg" rows="6" placeholder="টেক্সট লিখুন..." oninput="processText(\'' + slug + '\')"></textarea>' +
                    '<div id="result" class="mt-4 p-4 bg-gray-100 rounded-lg">ফলাফল এখানে দেখাবে...</div>';
            }
            
            if (type === 'generator') {
                return '<button onclick="generateOutput(\'' + slug + '\')" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">জেনারেট করুন</button>' +
                    '<div id="result" class="mt-4 p-6 bg-gray-100 rounded-lg text-center text-2xl font-mono">---</div>';
            }
            
            if (type === 'checker') {
                return '<input type="text" id="input" class="w-full p-4 border rounded-lg" placeholder="লিখুন...">' +
                    '<button onclick="checkInput(\'' + slug + '\')" class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">চেক করুন</button>' +
                    '<div id="result" class="mt-4 p-4 bg-gray-100 rounded-lg text-center"></div>';
            }
            
            if (type === 'calculator') {
                return '<div class="grid grid-cols-2 gap-4">' +
                    '<input type="number" id="num1" class="p-3 border rounded-lg" placeholder="প্রথম মান">' +
                    '<input type="number" id="num2" class="p-3 border rounded-lg" placeholder="দ্বিতীয় মান">' +
                    '</div>' +
                    '<button onclick="calculate(\'' + slug + '\')" class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">গণনা করুন</button>' +
                    '<div id="result" class="mt-4 p-6 bg-gray-100 rounded-lg text-center text-3xl font-bold">---</div>';
            }
            
            if (type === 'converter') {
                return '<textarea id="input" class="w-full p-4 border rounded-lg font-mono" rows="4" placeholder="ইনপুট লিখুন..."></textarea>' +
                    '<button onclick="convert(\'' + slug + '\')" class="mt-4 w-full bg-blue-600 text-white py-3 rounded-lg font-semibold">রূপান্তর করুন</button>' +
                    '<div id="result" class="mt-4 p-4 bg-gray-100 rounded-lg font-mono break-all"></div>';
            }
            
            return '<p class="text-center text-gray-500 py-10">এই টুলটি শীঘ্রই আসছে</p>';
        }

        // === GLOBAL FUNCTIONS ===
        window.processText = function(slug) {
            var text = document.getElementById('input').value;
            var result = document.getElementById('result');
            
            if (slug === 'word-counter') {
                var words = text.trim() ? text.trim().split(/\s+/).length : 0;
                result.innerHTML = '<p><strong>শব্দ:</strong> ' + words + ' | <strong>অক্ষর:</strong> ' + text.length + '</p>';
            } else if (slug === 'character-counter') {
                result.innerHTML = '<p><strong>মোট:</strong> ' + text.length + ' | <strong>স্পেস ছাড়া:</strong> ' + text.replace(/\s/g, '').length + '</p>';
            } else {
                result.textContent = 'প্রসেস: ' + text;
            }
        };

        window.generateOutput = function(slug) {
            var result = document.getElementById('result');
            
            if (slug === 'password-generator') {
                var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%';
                var pass = '';
                for (var i = 0; i < 16; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
                result.textContent = pass;
            } else if (slug === 'qr-code-generator') {
                result.innerHTML = '<p class="text-gray-500">QR কোড জেনারেটর</p>';
            } else {
                result.textContent = 'জেনারেট: ' + Math.random().toString(36).substring(7);
            }
        };

        window.checkInput = function(slug) {
            var input = document.getElementById('input').value;
            var result = document.getElementById('result');
            
            if (slug === 'email-validator') {
                var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input);
                result.innerHTML = '<p class="' + (valid ? 'text-green-600' : 'text-red-600') + ' font-bold">' + (valid ? '✅ ভ্যালিড ইমেইল' : '❌ ইনভ্যালিড ইমেইল') + '</p>';
            } else {
                result.innerHTML = '<p>' + (input ? '✅ ঠিক আছে' : '❌ কিছু লিখুন') + '</p>';
            }
        };

        window.calculate = function(slug) {
            var v1 = parseFloat(document.getElementById('num1').value) || 0;
            var v2 = parseFloat(document.getElementById('num2').value) || 0;
            var result = document.getElementById('result');
            var output = 0;
            
            if (slug === 'bmi-calculator') {
                var h = v2 / 100;
                output = (v1 / (h * h)).toFixed(1);
            } else if (slug === 'percentage-calculator') {
                output = ((v1 * v2) / 100).toFixed(2);
            } else {
                output = v1 + v2;
            }
            
            result.textContent = output;
        };

        window.convert = function(slug) {
            var input = document.getElementById('input').value;
            var result = document.getElementById('result');
            var output = '';
            
            try {
                if (slug === 'base64-encoder') output = btoa(input);
                else if (slug === 'base64-decoder') output = atob(input);
                else if (slug === 'url-encoder') output = encodeURIComponent(input);
                else if (slug === 'url-decoder') output = decodeURIComponent(input);
                else output = input;
            } catch (e) {
                output = 'Error: ' + e.message;
            }
            
            result.textContent = output;
        };

        // শুরু
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

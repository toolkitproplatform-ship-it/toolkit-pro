# ============================================
# Render.com Blueprint Configuration
# Toolkit Pro - All-in-One Online Tools Platform
# ============================================

services:
  # Main Web Service
  - type: web
    name: toolkit-pro
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    
    envVars:
      # Server Configuration
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      
      # Database Configuration
      - key: DATABASE_URL
        fromDatabase:
          name: toolkit-pro-db
          property: connectionString
      
      # Redis Configuration
      - key: REDIS_URL
        fromService:
          name: toolkit-pro-redis
          type: redis
          property: connectionString
      
      # Security
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      
      # AdSense Configuration
      - key: ADSENSE_ENABLED
        value: "true"
      - key: ADSENSE_AUTO_ADS
        value: "true"
      - key: ADSENSE_PUBLISHER_ID
        sync: false
      
      # CORS
      - key: CORS_ORIGIN
        value: "*"
      
      # Rate Limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "100"
      
      # Cache Configuration
      - key: CACHE_ENABLED
        value: "true"
      - key: CACHE_TTL_DEFAULT
        value: "300"
      - key: CACHE_TTL_TOOLS
        value: "600"

  # Redis Cache Service
  - type: redis
    name: toolkit-pro-redis
    plan: free
    ipAllowList: []

# PostgreSQL Database
databases:
  - name: toolkit-pro-db
    plan: free
    databaseName: toolkit_pro
    user: toolkit_admin
    ipAllowList: []
